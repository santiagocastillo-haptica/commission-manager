# Firebase App Hosting (Next.js sobre Cloud Run). Documentación: docs/04-despliegue.md
runConfig:
  cpu: 1
  memoryMiB: 1024
  minInstances: 0     # escala a cero cuando no hay uso (sin costo fijo)
  maxInstances: 3
  concurrency: 40

env:
  # Secreto guardado en Secret Manager (se crea con `firebase apphosting:secrets:set`).
  - variable: SESSION_SECRET
    secret: session-secret
    availability: [RUNTIME]

  # Ingreso con Google (Firebase Authentication). Estos valores son PÚBLICOS: se incrustan en el navegador al compilar.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBWHycp6-oAbzxkvJKJrwu3FjIp7cpxDUU
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: haptica-commission-manager.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: haptica-commission-manager
    availability: [BUILD, RUNTIME]

  # Dueño del sistema: al ingresar por primera vez con esta cuenta de Google se crea como administrador.
  # Cualquier otro correo debe estar registrado en la aplicación para poder entrar.
  - variable: BOOTSTRAP_ADMIN_EMAIL
    value: santiago.castillo@haptica.co
    availability: [RUNTIME]

  # FIRESTORE_EMULATOR_HOST NO se define aquí: en producción se usa Firestore real con la cuenta de servicio del backend.

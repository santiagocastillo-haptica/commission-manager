name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-session-secret-ci-session-secret-ci-session-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # El emulador de Firestore necesita Java 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Dominio, reportes y todas las pruebas de integración contra el emulador de Firestore.
      - run: npm run test:store
      - run: npm run build
